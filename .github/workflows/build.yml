
name: Build UNEX Marketplace APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract project
        run: |
          mkdir app
          unzip -q unex-marketplace.zip -d app
          PACKAGE_JSON=$(find app -name package.json -print -quit)
          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PACKAGE_JSON")" >> "$GITHUB_ENV"

    
      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install
          

      - name: Build web app
        run: cd "$PROJECT_DIR" && npm run build

      - name: Install Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Configure Android
        run: |
          cd "$PROJECT_DIR"
          npx cap init "UNEX Marketplace" "com.herzedev.unexmarketplace" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNEX-Marketplace-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
