
name: Build UNEX Marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir app
          unzip -q unex-marketplace.zip -d app
          PACKAGE_JSON=$(find app -name package.json -print -quit)
          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PACKAGE_JSON")" >> "$GITHUB_ENV"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && bun install --frozen-lockfile

      - name: Build project
        run: cd "$PROJECT_DIR" && bun run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: unex-marketplace-build
          path: ${{ env.PROJECT_DIR }}/dist/
